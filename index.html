<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maryoma Handmade</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #faf7f8; color: #333; padding-bottom: 40px; }
    
    header { 
      background: linear-gradient(135deg, #2b1055, #7597de, #b83280); 
      color: white; 
      text-align: center; 
      padding: 40px 20px 30px; 
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 8px 20px rgba(184, 50, 128, 0.15);
    }
    header h1 { 
      font-family: 'Tajawal', sans-serif;
      font-size: 32px; 
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    header p { 
      font-size: 15px; 
      opacity: 0.95; 
      background: rgba(255, 255, 255, 0.15);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
    .categories { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; }
    .cat-btn { background: #fff; border: 1px solid #eee; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .cat-btn.active { background: #b83280; color: white; border-color: #b83280; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: 0.3s; border: 1px solid #f0f0f0; cursor: pointer; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 210px; object-fit: cover; background: #eee; }
    .card-body { padding: 15px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .card-price { font-size: 18px; color: #b83280; font-weight: 700; }
    .loading { text-align: center; padding: 40px; font-size: 18px; color: #666; }

    /* النافذة المكبرة */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      animation: fadeIn 0.2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-close {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }
    .modal-img { width: 100%; max-height: 350px; object-fit: contain; background: #000; }
    .modal-body { padding: 20px; text-align: center; }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
    .modal-price { font-size: 22px; color: #b83280; font-weight: 800; margin-bottom: 15px; }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: white;
      text-decoration: none;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <h1>🌸 Maryoma Handmade 🌸</h1>
    <p>لمسات يدوية صُنِعت بكل حُب وإتقان ✨</p>
  </header>

  <div class="container">
    <div class="categories" id="categories">
      <button class="cat-btn active" onclick="filterCategory('الكل')">الكل</button>
    </div>

    <div id="loader" class="loading">جاري تحميل المنتجات...</div>
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- نافذة المعاينة المكبرة -->
  <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModalDirect()">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="">
      <div class="modal-body">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalPrice" class="modal-price"></div>
        <a id="modalWhatsapp" href="#" target="_blank" class="btn-whatsapp">
          <i class="fab fa-whatsapp" style="font-size: 20px;"></i> طلب عبر الواتساب
        </a>
      </div>
    </div>
  </div>

  <script>
    const myPhoneNumber = "201203175124"; 

    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1RKQ_p8rA1PC11Wa_m5dB-6KYUNRrehwq6mwZnAyMYY8/gviz/tq?tqx=out:json';

    let allProducts = [];

    async function fetchProducts() {
      try {
        const response = await fetch(sheetUrl);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        
        const rows = json.table.rows;
        allProducts = rows.map(row => ({
          name: row.c[0] ? row.c[0].v : '',
          price: row.c[1] ? row.c[1].v : '',
          image: row.c[2] ? row.c[2].v : 'https://via.placeholder.com/300?text=No+Image',
          category: row.c[3] ? row.c[3].v : 'عام'
        }));

        document.getElementById('loader').style.display = 'none';
        setupCategories();
        renderProducts(allProducts);
      } catch (error) {
        document.getElementById('loader').innerText = 'حدث خطأ أثناء تحميل البيانات.';
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map((p, idx) => `
        <div class="card" onclick="openModal(${idx})">
          <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300?text=صورة+غير+متاحة'">
          <div class="card-body">
            <div class="card-title">${p.name}</div>
            <div class="card-price">${p.price} جنيه</div>
          </div>
        </div>
      `).join('');
    }

    function setupCategories() {
      const cats = ['الكل', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const catContainer = document.getElementById('categories');
      catContainer.innerHTML = cats.map((c, i) => `
        <button class="cat-btn ${i === 0 ? 'active' : ''}" onclick="filterCategory('${c}', this)">${c}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      if (btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      if (cat === 'الكل') {
        renderProducts(allProducts);
      } else {
        renderProducts(allProducts.filter(p => p.category === cat));
      }
    }

    function openModal(index) {
      const p = allProducts[index];
      document.getElementById('modalImg').src = p.image;
      document.getElementById('modalTitle').innerText = p.name;
      document.getElementById('modalPrice').innerText = p.price + ' جنيه';
      
      const message = `مرحباً، أود الاستفسار عن طلب: (${p.name}) بسعر ${p.price} جنيه.`;
      const waUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
      document.getElementById('modalWhatsapp').href = waUrl;

      document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.classList.contains('modal-overlay')) {
        document.getElementById('productModal').style.display = 'none';
      }
    }

    function closeModalDirect() {
      document.getElementById('productModal').style.display = 'none';
    }

    fetchProducts();
  </script>
</body>
</html>
